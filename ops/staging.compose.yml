services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
    volumes: [staging_pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    image: adently-backend:${RELEASE_SHA:?Set RELEASE_SHA}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASS: ${DB_PASS:?Set DB_PASS}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      NODE_ENV: test
      PORT: 5000
      # This staging profile is synthetic-only: test SMTP stub and no external Groq.
      GROQ_API_KEY: ''
    command: [node, --require, ./scripts/mail-stub.cjs, index.js]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: [staging_uploads:/app/uploads]
    restart: unless-stopped
  frontend:
    image: adently-frontend:${RELEASE_SHA:?Set RELEASE_SHA}
    volumes: [./staging.nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ['127.0.0.1:${STAGING_HTTP_PORT:-8080}:80']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/health || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  staging_pg:
  staging_uploads:
