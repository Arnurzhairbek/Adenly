services:
  # PostgreSQL база данных
  postgres:
    image: postgres:16-alpine
    container_name: lang_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-lang_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lang_network

  # Backend сервер
  backend:
    build:
      context: ./lang-backend
      dockerfile: Dockerfile
    container_name: lang_backend
    environment:
      # База данных
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-lang_db}
      DB_PASS: ${DB_PASS:-postgres}
      DB_PORT: 5432
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_key_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      
      # Сервер
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      
      # Email (опционально)
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80,http://localhost,http://localhost:3000,http://localhost:5173}
    ports:
      - "5000:5000"
    volumes:
      - ./lang-backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lang_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend приложение
  frontend:
    build:
      context: ./lang-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: lang_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lang_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  lang_network:
    driver: bridge
