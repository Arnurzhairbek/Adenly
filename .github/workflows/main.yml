name: Adenly CI
on:
  push:
    branches: [main, feature/import-adenly-source]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lang-frontend/package-lock.json
      - run: npm ci
        working-directory: lang-frontend
      - run: npm run build
        working-directory: lang-frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: adently_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ci-test-password
      DB_NAME: adently_ci
      JWT_SECRET: ci-only-not-a-production-secret-123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lang-backend/package-lock.json
      - run: npm ci
        working-directory: lang-backend
      - run: node scripts/check-syntax.cjs
        working-directory: lang-backend
      - name: Start backend and check HTTP API with PostgreSQL
        working-directory: lang-backend
        run: |
          node --require ./scripts/mail-stub.cjs index.js > /tmp/adenly-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          node scripts/api-smoke.cjs
      - name: Backend logs
        if: failure()
        run: cat /tmp/adenly-backend.log
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Start Docker stack and verify readiness
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl --fail http://localhost/
          curl --fail http://localhost:5000/health
          curl --fail http://localhost:5000/api/courses
      - name: Docker logs
        if: failure()
        run: docker compose logs --no-color
        
       - name: Stop Docker stack
        if: always()
        run: docker compose down --volumes
        
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan project with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
     artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: lang-frontend
        run: npm ci

      - name: Build frontend
        working-directory: lang-frontend
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adently-frontend-build
          path: lang-frontend/dist/
          if-no-files-found: error
     
