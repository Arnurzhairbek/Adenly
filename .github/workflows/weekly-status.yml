name: weekly-status

on:
  schedule:
    - cron: '0 10 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  deployments: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ai-action/setup-ollama@v2
      - name: Start local Ollama and pull model
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://localhost:11434/api/tags >/dev/null
          ollama pull qwen2.5:3b
      - run: pip install -r requirements-ai.txt
      - name: Generate draft
        id: generate
        run: python scripts/weekly_status.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: qwen2.5:3b
          PROMPT_VERSION: v3
      - name: Verify generated metrics
        run: python scripts/verify_weekly_status.py --facts-file "${{ steps.generate.outputs.facts }}" --report "${{ steps.generate.outputs.report }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-status-draft-${{ github.run_number }}
          path: |
            project-management-ai/reports/*.md
            project-management-ai/facts/*.json
            project-management-ai/measurements/automation_runs.csv
          retention-days: 30
