name: DORA dashboard
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Staging delivery]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: dora-dashboard
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && vars.STAGING_ENABLED == 'true' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-dora.txt
      - run: pip install -r scripts/requirements-dora.txt
      - name: Collect actual deployments and incident ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dora.py --output artifacts/dora
      - name: Check collection completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/dora/metrics.json').read_text())
          assert report['deployments_complete'] and not report['errors'], 'Collection incomplete; inspect artifact reasons'
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dora-dashboard
          path: artifacts/dora/
          if-no-files-found: error
