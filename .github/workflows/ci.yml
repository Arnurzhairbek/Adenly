name: CI
on:
  push:
    branches: [main, feature/lz10-ci-dora]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lang-frontend/package-lock.json
      - run: npm ci
        working-directory: lang-frontend
      - run: npm run build
        working-directory: lang-frontend
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: adently_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: ci-test-password
      DB_NAME: adently_ci
      JWT_SECRET: ci-only-not-a-production-secret-123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lang-backend/package-lock.json
      - run: npm ci
        working-directory: lang-backend
      - run: node scripts/check-syntax.cjs
        working-directory: lang-backend
      - name: API integration tests with 50% line coverage gate
        run: npm run test:coverage
        working-directory: lang-backend
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: lang-backend/coverage/
          if-no-files-found: error
      - name: Backend logs
        if: failure()
        run: cat /tmp/adenly-api-test-server.log
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: VITE_API_URL=/api docker compose build
      - name: Start Docker stack and verify readiness
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl --fail http://localhost/
          curl --fail http://localhost:5000/health
          curl --fail http://localhost:5000/api/courses
      - name: Docker logs
        if: failure()
        run: docker compose logs --no-color
      - name: Retain image aliases for isolated staging validation
        run: |
          docker tag "$(docker compose images -q backend)" "adently-backend:$GITHUB_SHA"
          docker tag "$(docker compose images -q frontend)" "adently-frontend:$GITHUB_SHA"
      - name: Stop Docker stack
        if: always()
        run: docker compose down --volumes
      - name: Isolated staging release and rollback drill
        run: bash scripts/validate-staging.sh "$GITHUB_SHA"
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
  delivery-tests:
    name: DORA calculation tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v
      - run: bash -n scripts/staging-release.sh
  dora-snapshot:
    name: Real DORA snapshot
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-dora.txt
      - run: pip install -r scripts/requirements-dora.txt
      - name: Collect actual deployments and incident ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dora.py
      - uses: actions/upload-artifact@v4
        with:
          name: dora-dashboard
          path: docs/delivery/report/
          if-no-files-found: error
  ci-required:
    name: CI required
    if: always()
    needs: [frontend, backend, docker, secrets, delivery-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
